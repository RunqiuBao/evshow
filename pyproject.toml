[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evshow"
version = "1.0.0"
authors = [
  { name="Runiku Boa", email="bao@robot.t.u-tokyo.ac.jp" },
]
description = "framerize and visualize event raw data"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "opencv-python",
    "numba",
    "h5py",
    "hdf5plugin",
    "ruff",
    "tqdm",
    "scipy",
    "lmdb",
    "matplotlib",
]

[project.optional-dependencies]
# Heavy backends for the neural-network representations (e2vid needs torch,
# concentrate needs onnxruntime-gpu). Install with: pip install evshow[advanced]
advanced = [
    "torch",
    "onnxruntime-gpu",
]
# Everything needed to run the test suite (the tests exercise every
# representation, including the advanced backends).
test = [
    "pytest",
    "evshow[advanced]",
]

[project.scripts]
evshow = "evshow:__main__.main"
